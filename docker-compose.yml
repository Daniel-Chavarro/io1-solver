services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      SOLVER_EXAMPLES_DIR: /data/examples
    volumes:
      - ./examples:/data/examples:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
