name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  # main only accepts PRs coming from develop (GitFlow simplificado).
  # Runs BEFORE the test jobs so a wrong-base PR fails fast.
  guard-main-base:
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless the PR targets main from develop
        if: github.event.pull_request.head.ref != 'develop'
        run: |
          echo "::error::Los PRs a main solo se aceptan desde 'develop' (GitFlow). Ramas feat/fix integran primero en develop."
          exit 1

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
